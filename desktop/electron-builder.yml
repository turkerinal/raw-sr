# Packaging config. Owned by AGENT-B.
#
# The Electron app spawns `python -m desktop.backend.server`, so the bundled
# Python code must keep the `desktop` package layout in `extraResources`
# (the backend imports `desktop.backend.*`). `raw_sr` and `requirements.txt`
# are placed beside the app so the backend can import the engine.
appId: org.rawsr.desktop
productName: raw_sr

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

extraResources:
  # Engine (pure Python): imported by the backend.
  - from: ../raw_sr
    to: raw_sr
  # Python dependency manifest (used by run.sh / packagers).
  - from: ../requirements.txt
    to: requirements.txt
  # Backend package, kept under `desktop/` so `desktop.backend.server` imports.
  - from: backend
    to: desktop/backend
  - from: __init__.py
    to: desktop/__init__.py

linux:
  target:
    - AppImage
  category: Graphics
  synopsis: RAW multi-frame super-resolution
  description: >-
    Classical RAW multi-frame super-resolution. The Electron UI drives a local
    Python FastAPI backend that wraps the raw_sr engine.

win:
  target:
    - nsis

mac:
  target:
    - dmg
  category: public.app-category.graphics-design
